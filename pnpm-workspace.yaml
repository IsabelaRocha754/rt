packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true
# Tracked exceptions — no patched version exists upstream for either as of
# 2026-10-19. Both are dev-tooling-only (Expo CLI / Metro bundler), never
# shipped to end users. See docs/SECURITY.md §Checklist > Dependencies &
# supply chain for the review date; remove once upstream ships a fix.
audit:
  ignore:
    - GHSA-86w9-cpqp-85rv # node-forge, via @expo/cli
    - GHSA-vfj7-8cjw-p6xm # braces, via metro-file-map/micromatch
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.13"
  - "@expo/metro-config@58.0.15"
  - "@expo/router-server@58.0.15"
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
